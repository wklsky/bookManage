server: 
  port: 8080

spring:
datasource:
driver-class-name: com.mysql.cj.jdbc.Driver
url: jdbc:mysql://localhost:3306/book_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
username: root
password: your_password

data:
redis:
host: localhost
port: 6379
# password: your_redis_password # 如果没有密码可注释掉
